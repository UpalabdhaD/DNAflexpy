name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Runs on every push and every pull request. This is the gate: it includes
    # the 230 byte-equality cases that compare DNAflexpy's numeric output
    # against the frozen archive in rxv/DNAflexpy.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and its test dependencies
        run: pip install -e '.[dev]'
      - name: Run the test suite
        run: python -m pytest -q
      - name: Re-run the byte-equality gate on its own, so a failure is obvious
        run: python -m pytest tests/test_differential.py -k byte_identical -q

  deploy-docs:
    # Only on push to main. gh-deploy pushes to the gh-pages branch, which a
    # pull request has no permission to do -- running it on pull_request is
    # why this workflow failed on every PR.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs dependencies
        run: pip install mkdocs mkdocs-material mkdocs-material-extensions
      - name: Build strictly first, so a broken link fails here and not silently
        run: mkdocs build --strict
      - name: Publish to gh-pages
        run: mkdocs gh-deploy --force
